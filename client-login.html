<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">

<meta
name=“viewport”
content=“width=device-width, initial-scale=1.0”

<meta
name=“theme-color”
content=”#0f766e”

<meta
name=“description”
content=“MOSELI - Portal do Cliente”

  <title>MOSELI | Portal do Cliente</title>
  <!-- MOSELI CLIENT LOGIN CSS -->
  <link
    rel="stylesheet"
    href="./client-login.css"
  >
</head>
<body>
  <main class="client-login-page">
<div class="client-login-wrapper">
  <!-- =================================================
       BRAND
  ================================================== -->
  <div class="client-login-brand">
    <div
      class="client-login-logo"
      aria-label="MOSELI"
    >
      M
    </div>
    <h1>MOSELI</h1>
    <p>Gestão de Resíduos</p>
  </div>
  <!-- =================================================
       LOGIN CARD
  ================================================== -->
  <section
    class="client-login-card"
    aria-labelledby="loginTitle"
  >
    <h2 id="loginTitle">
      Portal do Cliente
    </h2>
    <p class="client-login-description">
      Entre na sua conta para consultar o seu serviço,
      recolhas, pagamentos e pedidos.
    </p>
    <!-- =================================================
         MESSAGE
    ================================================== -->
    <div
      id="loginMessage"
      class="client-login-message"
      role="alert"
      aria-live="polite"
    ></div>
    <!-- =================================================
         LOGIN FORM
    ================================================== -->
    <form
      id="clientLoginForm"
      class="client-login-form"
      novalidate
    >
      <!-- EMAIL -->
      <div class="client-login-field">
        <label for="clientEmail">
          Email
        </label>
        <input
          type="email"
          id="clientEmail"
          name="email"
          placeholder="cliente@email.com"
          autocomplete="email"
          inputmode="email"
          required
        >
      </div>
      <!-- PASSWORD -->
      <div class="client-login-field">
        <label for="clientPassword">
          Palavra-passe
        </label>
        <div class="client-login-password">
          <input
            type="password"
            id="clientPassword"
            name="password"
            placeholder="Introduza a sua palavra-passe"
            autocomplete="current-password"
            minlength="6"
            required
          >
          <button
            type="button"
            id="togglePassword"
            class="password-toggle"
            aria-label="Mostrar palavra-passe"
          >
            Mostrar
          </button>
        </div>
      </div>
      <!-- FORGOT PASSWORD -->
      <div class="client-login-options">
        <button
          type="button"
          id="forgotPasswordBtn"
          class="forgot-password-btn"
        >
          Esqueci a palavra-passe
        </button>
      </div>
      <!-- LOGIN BUTTON -->
      <button
        type="submit"
        id="loginButton"
        class="client-login-submit"
      >
        Entrar no Portal
      </button>
    </form>
  </section>
  <!-- =================================================
       FOOTER
  ================================================== -->
  <div class="client-login-footer">
    <div>
      ©
      <span id="loginYear">2026</span>
      MOSELI
    </div>
    <div>
      Portal seguro do cliente
    </div>
    <a
      href="./index.html"
      id="backToHome"
      class="client-login-back"
    >
      ← Voltar
    </a>
  </div>
</div>
  </main>
  <!-- =====================================================
       SUPABASE
       Load Supabase BEFORE client-login.js
  ====================================================== -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>
  <!-- =====================================================
       MOSELI CLIENT LOGIN JAVASCRIPT
  ====================================================== -->
  <script
    src="./client-login.js"
  ></script>
</body>
</html>
